name: MATLAB Code Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-matlab:
    name: MATLAB Syntax & Self-Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run Syntax and Self-Test
        uses: matlab-actions/run-command@v2
        with:
          command: "addpath(genpath(pwd)); res = runPipeline(imread('images/cover.jpg'), imread('images/logo.png'), 'gaussian'); disp(res.metrics);"
