name: MATLAB Code Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-matlab:
    name: MATLAB Syntax & Self-Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run Syntax and Self-Test
        uses: matlab-actions/run-command@v2
        with:
          command: "addpath(genpath(pwd)); cover = prepareCoverImage(loadImageFile('images/cover.jpg'), 128); W = prepareWatermarkLogo(loadImageFile('images/logo.png'), 16); emb = embedAllStages(cover, W); res = attackAndExtract(emb, 'gaussian'); disp(table(res.stageNames', res.alphas', res.psnr', res.ncc', 'VariableNames', {'Stage', 'Alpha', 'PSNR', 'NC_gaussian'}));"
